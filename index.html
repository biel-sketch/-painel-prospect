<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Prospecção — Reforma de Paletes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#090e13;
    --panel:#0f1923;
    --panel-2:#141f2c;
    --panel-3:#1a2535;
    --border:rgba(255,255,255,.07);
    --border-2:rgba(255,255,255,.12);
    --text:#ffffff;
    --text-muted:#7a92a8;
    --text-faint:#4a6070;
    --accent:#00d4d8;
    --accent-dim:rgba(0,212,216,.10);
    --accent-line:rgba(0,212,216,.25);
    --accent-ink:#032a2c;
    --blue:#0d6efd;
    --st-none:#4a6070;
    --st-contact:#f59e0b;
    --st-prospected:#00d4d8;
    --st-client:#00e5a0;
    --st-lost:#ff4d6a;
    --radius:12px;
    --font-display:'Inter',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 60% 50% at 0% 50%, rgba(0,40,80,.45), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:8px;
    background:var(--accent-dim);border:1px solid var(--accent-line);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);font-family:var(--font-display);font-weight:800;font-size:19px;
  }
  .brand-text h1{
    font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.3px;
    margin:0;line-height:1;
  }
  .brand-text span{
    font-family:var(--font-mono);font-size:11px;color:var(--text-muted);
    letter-spacing:.6px;text-transform:uppercase;
  }
  .service-badge{
    margin-left:4px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;font-weight:600;
    color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-dim);
    padding:6px 28px 6px 12px;border-radius:100px;text-transform:uppercase;white-space:nowrap;
    cursor:pointer;appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%2300d4d8' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  .service-badge option{background:var(--panel-2);color:var(--text);text-transform:none;}
  .city-tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .city-tab{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.4px;
    padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-muted);cursor:pointer;
    transition:.15s;text-transform:uppercase;
  }
  .city-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .city-tab.disabled{opacity:.4;cursor:not-allowed;}
  .city-tab.add-city{border-style:dashed;}

  /* ---------- STATS STRIP (quadro de embarque) ---------- */
  .stats-board{
    display:flex;gap:0;border-bottom:1px solid var(--border);
    background:var(--panel);overflow-x:auto;
  }
  .stat{
    flex:1;min-width:118px;
    padding:12px 18px;border-right:1px solid var(--border);
    display:flex;flex-direction:column;gap:2px;
  }
  .stat:last-child{border-right:none;}
  .stat-num{font-family:var(--font-mono);font-weight:600;font-size:26px;letter-spacing:.5px;}
  .stat-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);}
  .stat.stat-total .stat-num{color:var(--text);}
  .stat-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;}

  /* ---------- LAYOUT ---------- */
  .layout{flex:1;display:grid;grid-template-columns:1.35fr 1fr;min-height:0;}
  .map-col{position:relative;border-right:1px solid var(--border);}
  #map{width:100%;height:100%;background:#0a1220;}
  .leaflet-popup-content-wrapper{background:var(--panel-2);color:var(--text);border-radius:8px;border:1px solid var(--border);}
  .leaflet-popup-tip{background:var(--panel-2);}
  .leaflet-container a.leaflet-popup-close-button{color:var(--text-muted);}

  .list-col{display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .filters{
    padding:14px 16px 10px;border-bottom:1px solid var(--border);
    display:flex;flex-direction:column;gap:10px;
  }
  .search-row{display:flex;gap:8px;}
  .search-row input{
    flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:13px;
  }
  .search-row input::placeholder{color:var(--text-faint);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13px;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;
    padding:9px 14px;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
  }
  .status-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.3px;
    padding:6px 10px;border-radius:100px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text-muted);cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .chip.active{color:var(--text);border-color:var(--chip-color,var(--border));background:color-mix(in srgb, var(--chip-color) 16%, var(--panel-2));}
  .chip .dot{width:7px;height:7px;border-radius:2px;background:var(--chip-color);}

  .card-list{flex:1;overflow-y:auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;cursor:pointer;transition:.15s;position:relative;
  }
  .card:hover{border-color:var(--accent-line);transform:translateY(-1px);}
  .card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-name{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.15;}
  .card-seg{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .card-addr{font-size:12.5px;color:var(--text-muted);margin-top:8px;line-height:1.5;}
  .card-contact{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;}
  .card-contact span,.card-contact a{display:flex;align-items:center;gap:5px;color:var(--text-muted);text-decoration:none;}
  .card-contact a{color:var(--accent);}
  .card-contact a:hover{text-decoration:underline;}
  .card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .tag{
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.3px;
    padding:3px 7px;border-radius:4px;background:var(--panel-3);color:var(--text-muted);
    text-transform:uppercase;
  }
  .tag-target{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-line);}
  .tag-empty{opacity:.6;font-style:italic;text-transform:none;}
  .status-pill{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.3px;
    padding:4px 9px;border-radius:100px;white-space:nowrap;
    display:flex;align-items:center;gap:6px;text-transform:uppercase;
    background:color-mix(in srgb, var(--pill-color) 18%, transparent);
    color:var(--pill-color);border:1px solid color-mix(in srgb, var(--pill-color) 45%, transparent);
  }
  .status-pill .dot{width:6px;height:6px;border-radius:2px;background:var(--pill-color);}
  .card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .status-select{
    font-family:var(--font-mono);font-size:11px;background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;cursor:pointer;
  }
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* custom leaflet marker */
  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    background:var(--pin-color);
    border:2px solid rgba(0,0,0,.35);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
  }
  .pin::after{content:'';width:8px;height:8px;border-radius:2px;background:rgba(0,0,0,.35);transform:rotate(45deg);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,9,12,.72);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    width:100%;max-width:460px;padding:22px;max-height:90vh;overflow-y:auto;
  }
  .modal h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px;}
  .modal p.sub{color:var(--text-muted);font-size:12.5px;margin:0 0 18px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;
  }
  .field input,.field select,.field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:8px;font-family:var(--font-body);font-size:13.5px;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .target-check-row{display:flex;gap:8px;flex-wrap:wrap;}
  .check-pill{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--text-muted);
    background:var(--panel-2);border:1px solid var(--border);
    padding:8px 12px;border-radius:8px;cursor:pointer;user-select:none;
  }
  .check-pill input{accent-color:var(--accent);cursor:pointer;}
  .check-pill:has(input:checked){color:var(--text);border-color:var(--accent-line);background:var(--accent-dim);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;grid-template-rows:38vh 1fr;}
    .map-col{border-right:none;border-bottom:1px solid var(--border);}
    .stat{min-width:96px;padding:10px 12px;}
    .stat-num{font-size:20px;}
    .topbar{gap:12px;}
    .city-tabs{margin-left:0;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><i class="ti ti-map-pin-search"></i></div>
      <div class="brand-text">
        <h1>Painel de Prospecção</h1>
        <span>Central Comercial &middot; Multi-cidades</span>
      </div>
    </div>
    <select class="service-badge" id="segmentFilter">
      <option value="">Todos os Segmentos</option>
    </select>
    <div class="city-tabs" id="cityTabs"></div>
  </header>

  <div class="stats-board" id="statsBoard"></div>

  <main class="layout">
    <div class="map-col"><div id="map"></div></div>
    <aside class="list-col">
      <div class="filters">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Buscar empresa, bairro ou endereço...">
          <button class="btn" id="addBtn"><i class="ti ti-plus"></i> Empresa</button>
        </div>
        <div class="status-chips" id="statusChips"></div>
      </div>
      <div class="card-list" id="cardList"></div>
    </aside>
  </main>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nova empresa</h2>
    <p class="sub">Marque onde podemos atacar dentro da empresa</p>
    <form id="companyForm">
      <div class="field"><label>Nome da empresa</label><input type="text" id="f-name" required></div>
      <div class="field-row">
        <div class="field"><label>Segmento</label><input type="text" id="f-segment" placeholder="Ex: Metalurgia"></div>
        <div class="field"><label>Bairro / Distrito</label><input type="text" id="f-district" placeholder="Ex: D.I. Piemonte"></div>
      </div>
      <div class="field"><label>Endereço completo</label><input type="text" id="f-address" placeholder="Rua, número"></div>
      <div class="field">
        <label>Onde podemos atacar</label>
        <div class="target-check-row" id="targetChecks">
          <label class="check-pill"><input type="checkbox" value="Expedição"> Expedição</label>
          <label class="check-pill"><input type="checkbox" value="Produção"> Produção</label>
          <label class="check-pill"><input type="checkbox" value="Facilities"> Facilities</label>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Telefone / contato</label><input type="text" id="f-phone" placeholder="(31) 90000-0000"></div>
        <div class="field"><label>Site da empresa</label><input type="text" id="f-website" placeholder="www.empresa.com.br"></div>
      </div>
      <div class="field"><label>Status</label>
        <select id="f-status"></select>
      </div>
      <div class="field"><label>Observações</label><textarea id="f-notes" placeholder="Nome do contato, melhor horário, etc."></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost btn" id="deleteBtn" style="display:none;background:transparent;color:var(--st-lost);border:1px solid var(--st-lost);">Excluir</button>
        <div style="display:flex;gap:8px;margin-left:auto;">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
          <button type="submit" class="btn" id="saveBtn">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
const STATUSES = [
  {key:'none',       label:'Não Prospectado',  color:'var(--st-none)'},
  {key:'contact',     label:'Em Contato',       color:'var(--st-contact)'},
  {key:'prospected',  label:'Prospectado',      color:'var(--st-prospected)'},
  {key:'client',      label:'Cliente Ativo',    color:'var(--st-client)'},
  {key:'lost',        label:'Sem Interesse',    color:'var(--st-lost)'}
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s=>[s.key,s]));
function statusColor(key){
  const el = document.createElement('div');
  el.style.color = STATUS_MAP[key].color;
  document.body.appendChild(el);
  const c = getComputedStyle(el).color;
  document.body.removeChild(el);
  return c;
}

/* ============ STATE ============ */
let currentCity = 'betim';
let companies = [];
let map, markerLayer, markerIndex = {};
let editingId = null;
let activeStatusFilters = new Set(STATUSES.map(s=>s.key));
let searchTerm = '';

/* ============ STORAGE ============ */
const FB_BASE = 'https://loginserv-painel-default-rtdb.firebaseio.com';
function fbUrl(cityKey){ return `${FB_BASE}/prospeccao_${cityKey}.json`; }
let syncTimer = null;

async function loadCompanies(cityKey){
  let cloudData = null;
  try{
    const res = await fetch(fbUrl(cityKey));
    if(res.ok){
      const json = await res.json();
      if(json && Array.isArray(json) && json.length) cloudData = json;
    }
  }catch(e){ /* offline ou Firebase indisponível — segue com cache local */ }

  if(cloudData){
    companies = cloudData;
  }else{
    try{
      const raw = localStorage.getItem(`prospeccao:companies:${cityKey}`);
      companies = raw ? JSON.parse(raw) : [];
      if(!companies.length) throw new Error('empty');
    }catch(e){
      companies = CITIES[cityKey].seed.map(c=>({...c, status:'none', notes:''}));
    }
  }

  let needsSave = false;
  companies.forEach(c=>{
    if(!Array.isArray(c.targets)){ c.targets = []; needsSave = true; }
    if(typeof c.website !== 'string'){ c.website = ''; needsSave = true; }
  });

  // Reconciliação: adiciona ao conjunto do usuário qualquer empresa nova
  // que eu tenha incluído na seed (por id) sem sobrescrever edições existentes.
  const existingIds = new Set(companies.map(c=>c.id));
  (CITIES[cityKey].seed||[]).forEach(seedCo=>{
    if(!existingIds.has(seedCo.id)){
      companies.push({...seedCo, status: seedCo.status||'none', notes: seedCo.notes||''});
      needsSave = true;
    }
  });

  if(needsSave) await saveCompanies();
  restartAutoSync();
}

async function saveCompanies(){
  try{
    localStorage.setItem(`prospeccao:companies:${currentCity}`, JSON.stringify(companies));
  }catch(e){ console.error('Falha ao salvar localmente', e); }
  try{
    await fetch(fbUrl(currentCity), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(companies)
    });
  }catch(e){ console.error('Falha ao sincronizar com a nuvem', e); }
}

function restartAutoSync(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(async ()=>{
    if(!overlay.classList.contains('hidden')) return; // não sobrescreve edição em andamento
    try{
      const res = await fetch(fbUrl(currentCity));
      if(!res.ok) return;
      const json = await res.json();
      if(json && Array.isArray(json) && JSON.stringify(json)!==JSON.stringify(companies)){
        companies = json;
        localStorage.setItem(`prospeccao:companies:${currentCity}`, JSON.stringify(companies));
        renderAll();
      }
    }catch(e){ /* silencioso */ }
  }, 15000);
}

/* ============ RENDER: TABS ============ */
function renderCityTabs(){
  const el = document.getElementById('cityTabs');
  el.innerHTML = '';
  Object.entries(CITIES).forEach(([key,c])=>{
    const btn = document.createElement('button');
    btn.className = 'city-tab' + (key===currentCity?' active':'') + (!c.active?' disabled':'');
    btn.textContent = c.active ? c.name : `${c.name} · em breve`;
    if(c.active){
      btn.onclick = ()=> switchCity(key);
    }
    el.appendChild(btn);
  });
}

async function switchCity(key){
  if(key===currentCity) return;
  currentCity = key;
  editingId = null;
  await loadCompanies(currentCity);
  renderCityTabs();
  map.setView(CITIES[currentCity].center, CITIES[currentCity].zoom);
  renderAll();
}

/* ============ RENDER: STATS ============ */
function renderStats(){
  const el = document.getElementById('statsBoard');
  const total = companies.length;
  el.innerHTML = '';
  const totalStat = document.createElement('div');
  totalStat.className = 'stat stat-total';
  totalStat.innerHTML = `<div class="stat-num">${String(total).padStart(2,'0')}</div><div class="stat-label">Empresas &middot; ${CITIES[currentCity].name}</div>`;
  el.appendChild(totalStat);

  STATUSES.forEach(s=>{
    const count = companies.filter(c=>c.status===s.key).length;
    const stat = document.createElement('div');
    stat.className = 'stat';
    stat.innerHTML = `<div class="stat-num" style="color:${statusColor(s.key)}">${String(count).padStart(2,'0')}</div>
      <div class="stat-label"><span class="stat-dot" style="background:${statusColor(s.key)}"></span>${s.label}</div>`;
    el.appendChild(stat);
  });
}

/* ============ RENDER: FILTER CHIPS ============ */
function renderChips(){
  const el = document.getElementById('statusChips');
  el.innerHTML = '';
  STATUSES.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeStatusFilters.has(s.key)?' active':'');
    chip.style.setProperty('--chip-color', statusColor(s.key));
    chip.innerHTML = `<span class="dot"></span>${s.label}`;
    chip.onclick = ()=>{
      if(activeStatusFilters.has(s.key)) activeStatusFilters.delete(s.key);
      else activeStatusFilters.add(s.key);
      renderChips(); renderList(); renderMarkers();
    };
    el.appendChild(chip);
  });
}

/* ============ FILTER LOGIC ============ */
const ATTACK_SEGMENTS = ['Expedição','Produção','Facilities','Reforma de Paletes'];
let segmentFilter = '';
function filteredCompanies(){
  const term = searchTerm.trim().toLowerCase();
  return companies.filter(c=>{
    if(!activeStatusFilters.has(c.status)) return false;
    if(segmentFilter && segmentFilter!=='Reforma de Paletes' && !(c.targets||[]).includes(segmentFilter)) return false;
    if(!term) return true;
    return (c.name+' '+c.district+' '+c.address+' '+c.segment).toLowerCase().includes(term);
  });
}

function renderSegmentFilter(){
  const sel = document.getElementById('segmentFilter');
  if(sel.dataset.built) return;
  sel.innerHTML = '<option value="">Todos os Segmentos</option>' +
    ATTACK_SEGMENTS.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  sel.dataset.built = '1';
}

/* ============ RENDER: LIST ============ */
function renderList(){
  const el = document.getElementById('cardList');
  const items = filteredCompanies();
  el.innerHTML = '';
  if(!items.length){
    el.innerHTML = '<div class="empty-state">Nenhuma empresa encontrada com esses filtros.</div>';
    return;
  }
  items.forEach(c=>{
    const s = STATUS_MAP[c.status];
    const card = document.createElement('div');
    card.className = 'card' + (editingId===c.id?' selected':'');
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${escapeHtml(c.name)}</div>
          <div class="card-seg">${escapeHtml(c.segment||'—')}</div>
        </div>
        <div class="status-pill" style="--pill-color:${statusColor(c.status)}"><span class="dot"></span>${s.label}</div>
      </div>
      <div class="card-addr">${escapeHtml(c.district||'')}${c.district&&c.address?' &middot; ':''}${escapeHtml(c.address||'')}</div>
      <div class="card-contact">
        ${c.phone?`<span><i class="ti ti-phone"></i> ${escapeHtml(c.phone)}</span>`:''}
        ${c.website?`<a href="${normalizeUrl(c.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="ti ti-world"></i> ${escapeHtml(c.website)}</a>`:''}
      </div>
      <div class="card-tags">
        ${(c.targets&&c.targets.length) ? c.targets.map(t=>`<span class="tag tag-target">${escapeHtml(t)}</span>`).join('') : '<span class="tag tag-empty">Alvo não definido</span>'}
      </div>
      <div class="card-actions">
        <select class="status-select" data-id="${c.id}">
          ${STATUSES.map(st=>`<option value="${st.key}" ${st.key===c.status?'selected':''}>${st.label}</option>`).join('')}
        </select>
        <button class="icon-btn" data-focus="${c.id}"><i class="ti ti-map-pin"></i> Ver no mapa</button>
        <button class="icon-btn" data-edit="${c.id}"><i class="ti ti-pencil"></i> Editar</button>
      </div>
    `;
    el.appendChild(card);
  });

  el.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation());
    sel.addEventListener('change', e=>{
      e.stopPropagation();
      setStatus(sel.dataset.id, sel.value);
    });
  });
  el.querySelectorAll('[data-focus]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); focusCompany(b.dataset.focus); });
  });
  el.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); openModal(b.dataset.edit); });
  });
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalizeUrl(url){
  const u = String(url||'').trim();
  if(!u) return '#';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}

/* ============ STATUS CHANGE ============ */
async function setStatus(id, status){
  const c = companies.find(c=>c.id===id);
  if(!c) return;
  c.status = status;
  await saveCompanies();
  renderStats(); renderList(); renderMarkers();
}

/* ============ MAP ============ */
function initMap(){
  map = L.map('map', {zoomControl:true}).setView(CITIES[currentCity].center, CITIES[currentCity].zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap',
    maxZoom:19
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function pinIcon(color){
  return L.divIcon({
    className:'',
    html:`<div class="pin" style="--pin-color:${color}"></div>`,
    iconSize:[26,26],
    iconAnchor:[13,26],
    popupAnchor:[0,-24]
  });
}

function renderMarkers(){
  markerLayer.clearLayers();
  markerIndex = {};
  const items = filteredCompanies();
  items.forEach(c=>{
    if(typeof c.lat!=='number'||typeof c.lng!=='number') return;
    const s = STATUS_MAP[c.status];
    const marker = L.marker([c.lat,c.lng], {icon:pinIcon(statusColor(c.status))});
    marker.bindPopup(`
      <div style="font-family:'Inter',sans-serif;min-width:210px;max-width:240px;">
        <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:15px;margin-bottom:2px;">${escapeHtml(c.name)}</div>
        <div style="font-size:11px;color:#7a92a8;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;">${escapeHtml(c.segment||'—')}</div>
        <div style="font-size:11.5px;color:#7a92a8;margin-bottom:8px;">${escapeHtml(c.district||'')}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">
          ${(c.targets&&c.targets.length) ? c.targets.map(t=>`<span style="font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding:3px 7px;border-radius:4px;background:rgba(0,212,216,.10);color:#00d4d8;border:1px solid rgba(0,212,216,.25);">${escapeHtml(t)}</span>`).join('') : '<span style="font-size:10.5px;color:#4a6070;font-style:italic;">Alvo não definido</span>'}
        </div>
        ${c.phone?`<div style="font-size:11.5px;color:#7a92a8;margin-bottom:3px;">📞 ${escapeHtml(c.phone)}</div>`:''}
        ${c.website?`<div style="font-size:11.5px;margin-bottom:8px;"><a href="${normalizeUrl(c.website)}" target="_blank" rel="noopener" style="color:#00d4d8;">${escapeHtml(c.website)}</a></div>`:''}
        <select class="popup-status" data-id="${c.id}" style="width:100%;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;padding:5px;border-radius:6px;background:#141f2c;color:#ffffff;border:1px solid rgba(255,255,255,.12);">
          ${STATUSES.map(st=>`<option value="${st.key}" ${st.key===c.status?'selected':''}>${st.label}</option>`).join('')}
        </select>
      </div>
    `);
    marker.on('popupopen', ()=>{
      const sel = document.querySelector(`.popup-status[data-id="${c.id}"]`);
      if(sel) sel.addEventListener('change', ()=> setStatus(c.id, sel.value));
    });
    marker.on('click', ()=>{ editingId = c.id; renderList(); });
    markerLayer.addLayer(marker);
    markerIndex[c.id] = marker;
  });
}

function focusCompany(id){
  const c = companies.find(c=>c.id===id);
  if(!c) return;
  editingId = id;
  renderList();
  if(typeof c.lat==='number' && typeof c.lng==='number'){
    map.flyTo([c.lat,c.lng], 15, {duration:0.6});
    const m = markerIndex[id];
    if(m) setTimeout(()=>m.openPopup(), 650);
  }
}

/* ============ MODAL ============ */
const overlay = document.getElementById('modalOverlay');
const form = document.getElementById('companyForm');

function fillStatusSelect(){
  const sel = document.getElementById('f-status');
  sel.innerHTML = STATUSES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('');
}

function openModal(id){
  editingId = id || null;
  fillStatusSelect();
  document.getElementById('deleteBtn').style.display = id ? 'inline-block' : 'none';
  const checks = document.querySelectorAll('#targetChecks input[type=checkbox]');
  if(id){
    const c = companies.find(c=>c.id===id);
    document.getElementById('modalTitle').textContent = 'Editar empresa';
    document.getElementById('f-name').value = c.name||'';
    document.getElementById('f-segment').value = c.segment||'';
    document.getElementById('f-district').value = c.district||'';
    document.getElementById('f-address').value = c.address||'';
    document.getElementById('f-phone').value = c.phone||'';
    document.getElementById('f-website').value = c.website||'';
    document.getElementById('f-status').value = c.status||'none';
    document.getElementById('f-notes').value = c.notes||'';
    checks.forEach(ch=> ch.checked = (c.targets||[]).includes(ch.value));
  }else{
    document.getElementById('modalTitle').textContent = 'Nova empresa';
    form.reset();
    document.getElementById('f-status').value = 'none';
    checks.forEach(ch=> ch.checked = false);
  }
  overlay.classList.remove('hidden');
}
function closeModal(){ overlay.classList.add('hidden'); editingId = null; form.reset(); }

document.getElementById('addBtn').onclick = ()=> openModal(null);
document.getElementById('cancelBtn').onclick = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const targets = Array.from(document.querySelectorAll('#targetChecks input[type=checkbox]:checked')).map(ch=>ch.value);
  const data = {
    name: document.getElementById('f-name').value.trim(),
    segment: document.getElementById('f-segment').value.trim(),
    district: document.getElementById('f-district').value.trim(),
    address: document.getElementById('f-address').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    website: document.getElementById('f-website').value.trim(),
    status: document.getElementById('f-status').value,
    notes: document.getElementById('f-notes').value.trim(),
    targets
  };
  if(!data.name) return;

  if(editingId && companies.find(c=>c.id===editingId)){
    const c = companies.find(c=>c.id===editingId);
    Object.assign(c, data);
  }else{
    const center = CITIES[currentCity].center;
    const jitter = ()=> (Math.random()-0.5)*0.02;
    companies.push({
      id: 'c-'+Date.now(),
      ...data,
      lat: center[0]+jitter(),
      lng: center[1]+jitter()
    });
  }
  await saveCompanies();
  closeModal();
  renderAll();
});

document.getElementById('deleteBtn').onclick = async ()=>{
  if(!editingId) return;
  if(!confirm('Excluir esta empresa da lista de prospecção?')) return;
  companies = companies.filter(c=>c.id!==editingId);
  await saveCompanies();
  closeModal();
  renderAll();
};

/* ============ SEARCH ============ */
document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value;
  renderList(); renderMarkers();
});
document.getElementById('segmentFilter').addEventListener('change', e=>{
  segmentFilter = e.target.value;
  renderList(); renderMarkers();
});

/* ============ INIT ============ */
function renderAll(){
  renderSegmentFilter();
  renderStats();
  renderChips();
  renderList();
  renderMarkers();
}

(async function boot(){
  initMap();
  renderCityTabs();
  await loadCompanies(currentCity);
  renderAll();
})();
</script>
